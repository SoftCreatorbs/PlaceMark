{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block main_class %}auth{% endblock %}
{% block conteudo %}
<div class="auth-grade">
  {% include "_auth_lado.html" %}
  <section class="auth-form">
    <h1>Criar conta de aluno</h1>
    <p class="sub">Já tem conta? <a href="{{ url_for('auth.login', proximo=request.args.get('proximo')) }}">Entrar</a> · Quer vender? <a href="{{ url_for('empresa.cadastro') }}">Conta de empresa</a></p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% include "_campos_conta.html" %}
      <button class="btn btn-escuro btn-cheio">Criar conta</button>
    </form>
  </section>
</div>
{% endblock %}
